---
apiVersion: v1
kind: Namespace
metadata:
  name: allbal
---
# 1. Stockage persistant local sur K3s (15 Mo d'empreinte réelle -> 200 Mi alloués)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: allbal-data-pvc
  namespace: allbal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 200Mi
---
# 2. Déploiement applicatif FastAPI + SQLite (Single-Writer sur PVC RWO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allbal
  namespace: allbal
  labels:
    app: allbal
spec:
  replicas: 1
  strategy:
    # Important avec un PVC ReadWriteOnce + SQLite : terminer l'ancien Pod avant de monter le nouveau
    type: Recreate
  selector:
    matchLabels:
      app: allbal
  template:
    metadata:
      labels:
        app: allbal
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        fsGroup: 10001
      containers:
        - name: allbal
          image: ghcr.io/mathfrenchtoast/booksboxes:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ALLBAL_DB_PATH
              value: "/app/data/allbal.db"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            # Laisse jusqu'à 90s lors du tout premier démarrage (téléchargement initial des 4 dumps)
            httpGet:
              path: /api/stats
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /api/stats
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/stats
              port: http
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: allbal-data-pvc
---
# 3. Service interne ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: allbal
  namespace: allbal
spec:
  selector:
    app: allbal
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# 4. Middleware Traefik BasicAuth (équivalent .htaccess)
# Le Secret 'allbal-basic-auth-secret' se crée une seule fois via :
# kubectl -n allbal create secret generic allbal-basic-auth-secret \
#   --from-literal=users="$(htpasswd -nb VOTRE_USER 'VOTRE_MOT_DE_PASSE')"
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: allbal-basic-auth
  namespace: allbal
spec:
  basicAuth:
    secret: allbal-basic-auth-secret
    realm: "AllBAL Restricted Access"
---
# 5. Gateway API + Cert-Manager TLS sur vm-hostinger (identique au pattern sf2 / t3d)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-allbal-prod
spec:
  acme:
    email: mathieuv@frenchtoast.dev
    privateKeySecretRef:
      name: letsencrypt-allbal-prod-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: allbal-gateway
                namespace: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: allbal-gateway-tls
  namespace: traefik
spec:
  dnsNames:
    - bal.perso.frenchtoast.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-allbal-prod
  secretName: allbal-gateway-tls-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: allbal-gateway
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: allbal
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      hostname: "bal.perso.frenchtoast.dev"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 8443
      protocol: HTTPS
      hostname: "bal.perso.frenchtoast.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: allbal-gateway-tls-secret
      allowedRoutes:
        namespaces:
          from: All
---
# 6. HTTPRoute pour bal.perso.frenchtoast.dev avec filtre BasicAuth
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: allbal-route
  namespace: allbal
  labels:
    app: allbal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: allbal-gateway
      namespace: traefik
  hostnames:
    - "bal.perso.frenchtoast.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: allbal-basic-auth
      backendRefs:
        - group: ""
          kind: Service
          name: allbal
          port: 80
          weight: 1
